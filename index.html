<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Prep</title>
<style>
:root {
  --bg: #f5f4ef; --panel: #ffffff; --ink: #1b1a17; --muted: #6d6a61; --line: #dfdcd2; --field: #faf9f6;
  --accent: #1d5c48; --accent-ink: #ffffff; --soft: #e8f0ec; --warn: #a13d1f; --warn-soft: #fbeee9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151513; --panel: #1e1e1b; --ink: #edebe5; --muted: #9c998f; --line: #35342f; --field: #191917;
    --accent: #72c4a3; --accent-ink: #0e211a; --soft: #222b26; --warn: #e79273; --warn-soft: #2d1f1a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.wrap { max-width: 780px; margin: 0 auto; padding: 0 20px; }
header .wrap { display: flex; align-items: center; justify-content: space-between; padding-top: 22px; padding-bottom: 6px; }
h1 { font-size: 19px; margin: 0; letter-spacing: 0.01em; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.intro { color: var(--muted); margin: 6px 0 22px; font-size: 15px; }
.step { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 14px; }
.step h2 { font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
.step h2 i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 13px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.step h2 em { font-style: normal; font-weight: 400; color: var(--muted); font-size: 13px; }
.step > p { margin: 0 0 12px 34px; color: var(--muted); font-size: 14px; }
textarea, input[type=text], input[type=password], select { width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; font-size: 15px; }
textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
textarea:focus, input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.go { margin: 18px 0 8px; }
.btn { border: 1.5px solid var(--accent); background: transparent; color: var(--accent); border-radius: 11px; padding: 10px 18px; font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.big { width: 100%; padding: 15px; font-size: 17px; }
.btn:disabled { opacity: .5; cursor: default; }
.status { background: var(--warn-soft); color: var(--warn); border-radius: 9px; padding: 10px 14px; font-size: 14.5px; margin-top: 12px; }
.status.ok { background: var(--soft); color: var(--accent); }
#session .bar { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; gap: 14px; padding: 14px 0 12px; border-bottom: 1px solid var(--line); }
#session .bar b { flex: 1; font-size: 16px; }
#log { padding: 8px 0 20px; min-height: 50vh; overflow-wrap: anywhere; }
.msg { padding: 16px 0; }
.msg + .msg { border-top: 1px solid var(--line); }
.who { font-size: 12px; font-weight: 700; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: baseline; }
.who span + span { display: flex; gap: 14px; }
.who .link { font-size: 13px; font-weight: 400; letter-spacing: 0; }
.msg.user .body { white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 10px 14px; }
.body > :first-child { margin-top: 0; }
.body > :last-child { margin-bottom: 0; }
.body table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 14px; margin: 10px 0; }
.body th, .body td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.body th { background: var(--field); }
.body pre { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 12px; overflow-x: auto; font-size: 13.5px; line-height: 1.5; }
.body code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.9em; }
.body h1, .body h2, .body h3 { font-size: 17px; margin: 20px 0 8px; }
.body p, .body ul, .body ol { margin: 8px 0; }
.dots span { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.composer { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 18px; border-top: 1px solid var(--line); }

aside { position: fixed; inset: 0 auto 0 0; width: 264px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 12px 12px; z-index: 5; transition: transform .2s; }
aside h1 { padding: 0 8px 14px; }
aside .btn { width: 100%; }
#chats { flex: 1; overflow-y: auto; margin-top: 14px; }
.chat { display: flex; align-items: center; border-radius: 9px; padding: 0 4px 0 10px; cursor: pointer; }
.chat:hover, .chat.on { background: var(--soft); }
.chat span { flex: 1; padding: 9px 0; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat.busy span::after { content: " …"; color: var(--accent); }
.chat button { background: none; border: 0; color: var(--muted); font-size: 17px; padding: 4px 8px; visibility: hidden; }
.chat:hover button { visibility: visible; }
main { margin-left: 264px; }
#menu { display: none; background: none; border: 0; font-size: 22px; padding: 0 12px 0 0; }
#shade { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .4); z-index: 4; }
header { display: none; }
@media (max-width: 860px) {
  aside { transform: translateX(-100%); }
  body.open aside { transform: none; }
  body.open #shade { display: block; }
  main { margin-left: 0; }
  header { display: block; }
  header .wrap { justify-content: flex-start; }
  #menu { display: block; }
  .chat button { visibility: visible; }
}
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: 0 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; font-size: 13.5px; white-space: nowrap; }
.chips button:hover { border-color: var(--accent); color: var(--accent); }
.chips button:disabled { opacity: .5; cursor: default; }
.composer .btn { white-space: nowrap; flex: 0 0 auto; }
.composer .box { display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { min-height: 52px; max-height: 40vh; resize: none; }
.composer small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 6px; }
#setup { padding-top: 22px; }
#wipe { padding: 10px 8px 0; text-align: left; color: var(--muted); font-size: 13px; }
.step h2 .up { margin-left: auto; font-weight: 400; }
.doc.over textarea { border-color: var(--accent); background: var(--soft); }
.note { font-size: 13px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<aside>
  <h1>Interview Prep</h1>
  <button class="btn primary" id="new">＋ 新对话</button>
  <div id="chats"></div>
  <button class="link" id="wipe" hidden>清空全部对话</button>
</aside>
<div id="shade"></div>

<main>
<header><div class="wrap"><button id="menu" aria-label="对话列表">☰</button><h1>Interview Prep</h1></div></header>

<div class="wrap" id="setup">
  <p class="intro">北美面试准备：贴上岗位，传上简历，说你想做什么。 <button class="link" id="sample">用示例试试</button> <button class="link" id="reuse" hidden>使用已保存的资料</button></p>

  <div class="step doc" data-doc="jd">
    <h2><i>1</i>岗位描述<button class="link up">上传文件</button></h2>
    <textarea id="jd" rows="6" placeholder="粘贴文本，或把 PDF / Word 文件拖到这里"></textarea>
    <div class="note" hidden></div>
    <input type="file" accept=".pdf,.docx,.md,.markdown,.txt" hidden>
  </div>

  <div class="step doc" data-doc="cv">
    <h2><i>2</i>简历<button class="link up">上传文件</button></h2>
    <textarea id="cv" rows="7" placeholder="粘贴文本，或把 PDF / Word 文件拖到这里"></textarea>
    <div class="note" hidden></div>
    <input type="file" accept=".pdf,.docx,.md,.markdown,.txt" hidden>
  </div>

  <div class="step doc" data-doc="refs">
    <h2><i>3</i>参考资料 <em>可选</em><button class="link up">上传文件</button></h2>
    <textarea id="refs" rows="4" placeholder="粘贴文本，或把 PDF / Word 文件拖到这里"></textarea>
    <div class="note" hidden></div>
    <input type="file" accept=".pdf,.docx,.md,.markdown,.txt" multiple hidden>
  </div>

  <div class="step">
    <h2><i>4</i>想做什么</h2>
    <textarea id="want" rows="2" style="min-height:64px" placeholder="例如：帮我准备这个岗位的面试 / 来一轮 behavioral 模拟面试 / 模拟 system design / 我刚面完，帮我复盘"></textarea>
  </div>

  <div class="go">
    <button class="btn primary big" id="run">开始</button>
    <div class="status" id="status" hidden></div>
  </div>
</div>

<div class="wrap" id="session" hidden>
  <div class="bar">
    <b id="title"></b>
    <button class="link" id="keep"></button>
    <button class="link" id="export">导出</button>
  </div>
  <div id="log"></div>
  <div class="status" id="sessionStatus" hidden></div>
  <div class="composer">
    <div class="chips" id="chips"></div>
    <div class="box">
      <textarea id="answer" rows="2" placeholder="输入你的回答"></textarea>
      <button class="btn primary" id="send">发送</button>
      <button class="btn" id="stop" hidden>停止</button>
    </div>
    <small>Enter 发送，Shift + Enter 换行</small>
  </div>
</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
<script>
const ADAPTER = `You are running as a web chat for a job candidate, not inside the jobpipe repository. There is no file system and no shell. Read the skill below with these substitutions:
- "the pack" and jd.txt are the JOB DESCRIPTION section of the first user message. There is no slug; never ask for one. If there is no JOB DESCRIPTION, work without a pack.
- me/cv.md is the RESUME section. It is the only source of facts about the candidate.
- me/stories.md, me/interview-log.md, 00-jd-breakdown.md, report.md and any earlier 02-interview-prep.md exist only if they appear under REFERENCE MATERIALS. Otherwise treat them as not existing yet.
- There is no config/profile.yml. Ask the candidate for work authorization or level only when the output needs it.
- The candidate does not know the command names. Their REQUEST is free text in any language: infer which command it means and run it. With no request, run prep when there is a job description, otherwise ask in one sentence what they would like to do.
- Where the skill says to write or append to a file, print that content in the chat under a plain heading, so the candidate can export it and add it back next time under reference materials.
- Skip every ./jobpipe.sh command, and never mention files, slugs, packs, commands or this skill to the candidate: they only see this chat.
Everything else in the skill applies unchanged.`;

const SAMPLE = {
  jd: `Northwind Payments — Software Engineer, Backend (Payouts)
Location: New York, NY (hybrid)   Compensation: $135,000 - $165,000 base plus equity

The Payouts team moves money to more than 200,000 merchants every day. Correctness matters more than anything else here: a payout must happen exactly once, for the right amount, on time.

What you'll do
- Design, build and operate backend services in Go and Java that schedule and execute merchant payouts
- Make our payout pipeline idempotent and resilient to bank-rail failures and retries
- Participate in the on-call rotation and drive postmortems to real fixes

What we're looking for
- 1-3 years of experience building backend services in production
- Strong skills in Go or Java
- Experience with relational databases, including transactions and schema design
- Experience with message queues or event streaming (Kafka, SQS or similar)
- An understanding of distributed systems fundamentals: idempotency, retries, consistency

Interview process: recruiter call, a 60-minute technical phone screen (coding), then a virtual onsite: coding, system design, behavioral. We are able to sponsor work visas for this role.`,
  cv: `Alex Chen — Backend software engineer, 1.5 years of experience. M.S. Computer Science.

Lumen Logistics, Jersey City, NJ — Software Engineer (07/2025 - Present)
- Built a shipment-tracking event service in Go on Kafka and PostgreSQL that processes 3M events per day with p99 latency under 120 ms.
- Cut duplicate webhook deliveries from 1.8% to 0.02% by adding idempotency keys and a Redis-backed dedup window.
- Migrated 14 cron jobs to a queue-based scheduler, reducing missed runs from about 5 per week to zero over 3 months.
- On-call in a 5-person rotation; wrote 6 runbooks and led the postmortem for a 40-minute outage caused by a connection pool leak.

Brightpath Health, Remote — Software Engineer Intern (05/2024 - 08/2024)
- Added a token-bucket rate limiter to the public appointments API in Java Spring Boot, cutting 429-related support tickets by 30%.
- Wrote integration tests that raised coverage of the scheduling module from 54% to 81%.

Skills: Go, Java, Python, SQL, Kafka, PostgreSQL, Redis, gRPC, AWS (ECS, SQS, RDS), Docker, Terraform`,
  want: "帮我准备这个岗位的面试",
};

const CHIPS = ["我卡住了，给个提示", "结束这一轮，给我评分", "来一轮 behavioral 模拟面试", "模拟 coding 面试", "模拟 system design", "帮我整理 STAR 故事", "把自我介绍改得更口语", "面试官会追问我简历的哪些地方？", "我该反问面试官什么？", "先暂停一下"];

const $ = (id) => document.getElementById(id);
const store = {
  get: (k) => { try { return localStorage.getItem("ip." + k) || ""; } catch { return ""; } },
  set: (k, v) => { try { localStorage.setItem("ip." + k, v); return true; } catch { return false; } },
};
const FIELDS = ["jd", "cv", "refs", "want"];
const SKILL_FILES = ["SKILL", "prep", "behavioral", "coding", "system-design"];
const CDN = "https://cdnjs.cloudflare.com/ajax/libs/";
const DEAD = "服务暂时没有开启，请稍后再试，或联系给你链接的人。";
const CONFIG_URLS = ["https://api.github.com/repos/Layton2617/interview-prep/contents/relay.json", "https://raw.githubusercontent.com/Layton2617/interview-prep/main/relay.json"];

let chats = [];
let current = null;
let system = "";

const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get("r")) { store.set("r", hash.get("r")); store.set("k", hash.get("k") || ""); history.replaceState(null, "", location.pathname); }
let relay = "";
let code = "";

async function findRelay() {
  if (store.get("r") === "local") { relay = "http://localhost:8787"; code = store.get("k"); return; }
  for (const url of CONFIG_URLS) {
    try {
      const res = await fetch(url, { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store" });
      const d = await res.json();
      if (/^[a-z0-9-]+$/.test(d.r || "")) { relay = `https://${d.r}.trycloudflare.com`; code = d.k || ""; return; }
    } catch {}
  }
}

function status(text, ok) {
  const el = $("session").hidden ? $("status") : $("sessionStatus");
  $("status").hidden = $("sessionStatus").hidden = true;
  if (!text) return;
  el.textContent = text;
  el.className = "status" + (ok ? " ok" : "");
  el.hidden = false;
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error("文件读取组件加载失败，请检查网络后重试"));
    document.head.appendChild(s);
  });
}

async function pdfText(file) {
  if (!window.pdfjsLib) {
    await loadScript(CDN + "pdf.js/3.11.174/pdf.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc = CDN + "pdf.js/3.11.174/pdf.worker.min.js";
  }
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const content = await (await pdf.getPage(i)).getTextContent();
    let text = "", lastY = null;
    for (const it of content.items) {
      const y = it.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 2) text += "\n";
      else if (text && !text.endsWith(" ") && !text.endsWith("\n")) text += " ";
      text += it.str;
      lastY = y;
    }
    pages.push(text.replace(/ {2,}/g, " "));
  }
  return pages.join("\n\n");
}

async function docxText(file) {
  if (!window.mammoth) await loadScript(CDN + "mammoth/1.6.0/mammoth.browser.min.js");
  return (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
}

async function fileText(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith(".pdf")) return pdfText(file);
  if (name.endsWith(".docx")) return docxText(file);
  if (name.endsWith(".doc")) throw new Error(`${file.name} 是旧版 Word 格式，请另存为 .docx 或 PDF 再上传`);
  return file.text();
}

async function takeFiles(box, files) {
  const ta = box.querySelector("textarea");
  const note = box.querySelector(".note");
  const many = box.dataset.doc === "refs";
  try {
    status("正在读取文件…", true);
    const parts = [], names = [];
    for (const f of files) {
      const text = (await fileText(f)).trim();
      if (!text) throw new Error(`${f.name} 里没有读到文字。扫描件读不了，请改为粘贴文本。`);
      parts.push(many ? `--- ${f.name} ---\n${text}` : text);
      names.push(f.name);
      if (!many) break;
    }
    ta.value = many && ta.value.trim() ? ta.value.trim() + "\n\n" + parts.join("\n\n") : parts.join("\n\n");
    store.set(ta.id, ta.value);
    note.textContent = `已读取 ${names.join("、")}，可以直接在上面修改`;
    note.hidden = false;
    status("");
  } catch (e) {
    status(e.message);
  }
}

function wireDoc(box) {
  const input = box.querySelector("input[type=file]");
  box.querySelector(".up").onclick = () => input.click();
  input.onchange = () => { takeFiles(box, [...input.files]); input.value = ""; };
  box.ondragover = (e) => { e.preventDefault(); box.classList.add("over"); };
  box.ondragleave = () => box.classList.remove("over");
  box.ondrop = (e) => { e.preventDefault(); box.classList.remove("over"); if (e.dataTransfer.files.length) takeFiles(box, [...e.dataTransfer.files]); };
}

async function systemPrompt() {
  if (!system) {
    const texts = await Promise.all(SKILL_FILES.map(async (n) => {
      const r = await fetch(`skill/${n}.md`);
      if (!r.ok) throw new Error("页面资源加载失败，请刷新后重试");
      return `# ${n === "SKILL" ? "SKILL.md" : `references/${n}.md`}\n\n` + await r.text();
    }));
    system = [ADAPTER, ...texts].join("\n\n---\n\n");
  }
  return system;
}

function context() {
  const block = (title, text) => text.trim() ? `## ${title}\n"""\n${text.trim()}\n"""\n\n` : "";
  return block("JOB DESCRIPTION", $("jd").value) + block("RESUME", $("cv").value)
    + block("REFERENCE MATERIALS", $("refs").value) + block("REQUEST", $("want").value);
}

function saveChats() {
  const data = () => JSON.stringify(chats.map(({ id, title, messages, fields }) => ({ id, title, messages, fields })));
  while (!store.set("chats", data()) && chats.length > 1) chats.pop();
}

function drawChats() {
  const box = $("chats");
  box.innerHTML = "";
  for (const c of chats) {
    const row = document.createElement("div");
    row.className = "chat" + (c === current ? " on" : "") + (c.busy ? " busy" : "");
    const name = document.createElement("span");
    name.textContent = c.title;
    const del = document.createElement("button");
    del.textContent = "×";
    del.title = "删除";
    del.onclick = (e) => { e.stopPropagation(); removeChat(c); };
    row.append(name, del);
    row.onclick = () => openChat(c);
    box.appendChild(row);
  }
}

function syncBusy() {
  const on = Boolean(current && current.busy);
  $("send").hidden = on;
  $("stop").hidden = !on;
  $("chips").querySelectorAll("button").forEach((b) => { b.disabled = on; });
}

function show(chat) {
  current = chat;
  $("setup").hidden = Boolean(chat);
  $("session").hidden = !chat;
  document.body.classList.remove("open");
  status("");
  drawChats();
  syncBusy();
  $("reuse").hidden = !store.get("kept");
  $("wipe").hidden = !chats.length;
  drawKeep();
  if (chat) { render(); window.scrollTo(0, document.body.scrollHeight); $("answer").focus(); }
  else window.scrollTo(0, 0);
}

function openChat(chat) { show(chat); }

function drawKeep() {
  $("keep").hidden = !current || !current.fields;
  $("keep").textContent = store.get("kept") ? "清除已保存的资料" : "保存资料，下次直接用";
}

function fill(values) {
  for (const k of FIELDS) { $(k).value = values[k] || ""; store.set(k, $(k).value); }
  document.querySelectorAll(".note").forEach((n) => { n.hidden = true; });
}

function removeChat(chat) {
  if (!confirm(`删除“${chat.title}”？`)) return;
  if (chat.busy) chat.aborter.abort();
  chats = chats.filter((c) => c !== chat);
  saveChats();
  show(chat === current ? null : current);
}

function render() {
  $("title").textContent = current.title;
  const log = $("log");
  log.innerHTML = "";
  current.messages.forEach((m, i) => {
    const div = document.createElement("div");
    div.className = "msg " + m.role;
    const who = document.createElement("div");
    who.className = "who";
    who.innerHTML = `<span>${m.role === "user" ? "你" : "面试官 / 教练"}</span>`;
    const body = document.createElement("div");
    body.className = "body";
    if (m.role === "user") {
      body.textContent = i === 0 ? current.title : m.content;
    } else if (!m.content) {
      body.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
    } else {
      body.innerHTML = DOMPurify.sanitize(marked.parse(m.content));
      const tools = document.createElement("span");
      const copy = document.createElement("button");
      copy.className = "link";
      copy.textContent = "复制";
      copy.onclick = () => navigator.clipboard.writeText(m.content).then(() => { copy.textContent = "已复制"; });
      tools.appendChild(copy);
      who.appendChild(tools);
    }
    div.append(who, body);
    log.appendChild(div);
  });
}

async function complete(chat) {
  const payload = [{ role: "system", content: system }, ...chat.messages];
  const reply = { role: "assistant", content: "" };
  chat.messages.push(reply);
  chat.busy = true;
  chat.aborter = new AbortController();
  const paint = (toEnd) => {
    if (chat !== current) return;
    const pinned = toEnd || window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
    render();
    if (pinned) window.scrollTo(0, document.body.scrollHeight);
  };
  if (chat === current) status("");
  drawChats(); syncBusy(); paint(true);
  let error = "";
  try {
    let res;
    for (let attempt = 0; ; attempt++) {
      try {
        res = await fetch(relay, {
          method: "POST", signal: chat.aborter.signal,
          headers: { "Content-Type": "application/json", "X-Access-Code": code },
          body: JSON.stringify({ id: chat.id, messages: payload }),
        });
        if (res.status !== 403 || attempt) break;
      } catch (e) {
        if (e.name !== "TypeError" || attempt) throw e;
      }
      await findRelay();
    }
    if (!res.ok) throw new Error(res.status === 403 ? DEAD : res.status === 413 ? "资料太长了，请删减参考资料后重试。" : res.status === 429 ? "今天的使用量已达上限，请明天再来。" : "服务暂时出错，请稍后再试。");
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "", last = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith("data:")) continue;
        const data = t.slice(5).trim();
        if (data === "[DONE]") continue;
        reply.content += JSON.parse(data).choices?.[0]?.delta?.content || "";
      }
      if (Date.now() - last > 100) { paint(); last = Date.now(); }
    }
  } catch (e) {
    error = e.name === "AbortError" ? "" : e.name === "TypeError" ? DEAD : e.message;
  }
  chat.busy = false;
  if (!reply.content) chat.messages.pop();
  if (chat.messages.length === 1) {
    chats = chats.filter((c) => c !== chat);
    saveChats();
    if (chat === current) { show(null); status(error); } else drawChats();
    return;
  }
  saveChats();
  drawChats();
  if (chat === current) { syncBusy(); paint(); status(error); }
}

async function start() {
  if (!relay) await findRelay();
  if (!relay) return status(DEAD);
  if (!$("jd").value.trim() && !$("cv").value.trim()) return status("请先填岗位描述，或上传简历。");
  try {
    await systemPrompt();
  } catch (e) {
    return status(e.message);
  }
  const want = $("want").value.trim();
  const chat = { id: crypto.randomUUID().replace(/-/g, "").slice(0, 16), title: want.slice(0, 40) || "面试准备", messages: [{ role: "user", content: context() }] };
  chats.unshift(chat);
  chat.fields = Object.fromEntries(["jd", "cv", "refs"].map((k) => [k, $(k).value]));
  fill({});
  show(chat);
  complete(chat);
}

async function send(preset) {
  const text = typeof preset === "string" ? preset : $("answer").value.trim();
  if (!text || !current || current.busy) return;
  try {
    await systemPrompt();
  } catch (e) {
    return status(e.message);
  }
  current.messages.push({ role: "user", content: text });
  if (typeof preset !== "string") { $("answer").value = ""; $("answer").style.height = ""; }
  complete(current);
}

function exportChat() {
  const text = current.messages.slice(1).map((m) => `## ${m.role === "user" ? "Candidate" : "Interviewer / Coach"}\n\n${m.content}`).join("\n\n---\n\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([`# ${current.title}\n\n${text}\n`], { type: "text/markdown" }));
  a.download = `interview-prep-${new Date().toISOString().slice(0, 10)}.md`;
  a.click();
}

for (const k of FIELDS) {
  $(k).value = store.get(k);
  $(k).addEventListener("input", () => store.set(k, $(k).value));
}
document.querySelectorAll(".doc").forEach(wireDoc);
window.addEventListener("hashchange", () => location.reload());
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => e.preventDefault());

for (const text of CHIPS) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = text;
  b.onclick = () => send(text);
  $("chips").appendChild(b);
}
$("sample").onclick = () => {
  fill(SAMPLE);
  status("已填入示例，点“开始”。", true);
};
$("new").onclick = () => { fill({}); show(null); };
$("reuse").onclick = () => { fill(JSON.parse(store.get("kept") || "{}")); $("want").focus(); };
$("keep").onclick = () => { store.set("kept", store.get("kept") ? "" : JSON.stringify(current.fields)); drawKeep(); };
$("wipe").onclick = () => {
  if (!confirm("清空这个浏览器里的全部对话？")) return;
  for (const c of chats) if (c.busy) c.aborter.abort();
  chats = [];
  saveChats();
  show(null);
};
$("menu").onclick = () => document.body.classList.toggle("open");
$("shade").onclick = () => document.body.classList.remove("open");
$("run").onclick = start;
$("send").onclick = send;
$("stop").onclick = () => current && current.aborter && current.aborter.abort();
$("export").onclick = exportChat;
$("answer").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("answer").addEventListener("input", () => {
  $("answer").style.height = "auto";
  $("answer").style.height = Math.min($("answer").scrollHeight + 2, window.innerHeight * 0.4) + "px";
});

try {
  const saved = JSON.parse(store.get("chats") || "[]");
  if (Array.isArray(saved)) chats = saved.filter((c) => c && c.id && Array.isArray(c.messages) && c.messages.length > 1);
} catch {}
show(null);
findRelay().then(() => { if (!relay) status(DEAD); });
</script>
